# Configuração de Otimização do Pipeline ELT
# Ajustar valores conforme recursos disponíveis

optimization:
  # Processamento de Telefonia
  phone_processing:
    batch_size: 100000 # 48GB RAM aguenta batches grandes
    cache_enabled: true
    cache_max_size: 500000 # Cache maior = menos re-parsing
    regex_precompile: true

  # Conversão Parquet
  parquet_processing:
    chunk_size: 500000 # NVMe + 48GB: chunks grandes = menos I/O
    compression: snappy
    enrichment_enabled: true
    write_statistics: true

  # Carga PostgreSQL
  postgres_load:
    parallel_enabled: true
    max_workers: 10 # R5 3600: 12 threads, deixa 2 livres pro SO
    batch_size: 500000
    pool_size: 16
    max_overflow: 32
    create_indexes: true
    index_concurrently: true

  # Exportação
  export:
    batch_size: 200000 # Chunks maiores = menos roundtrips no banco
    segmentations:
      - anual
      - trimestral
      - mensal
    parallel_export: true
    compression: none

  # Monitoramento
  monitoring:
    prometheus_port: 8000
    metrics_interval_seconds: 10
    hardware_monitoring_enabled: true
    detailed_metrics: true

# Configurações do Dashboard
dashboard:
  grafana:
    refresh_interval_seconds: 30
    data_source_prometheus: prometheus
    data_source_postgres: postgres
    timezone: America/Sao_Paulo

  alerts:
    error_rate_threshold: 0.05 # 5%
    slow_query_threshold: 2.0 # segundos
    memory_threshold: 0.90 # 90%
    disk_threshold: 0.85 # 85%

# Configurações de Logging
logging:
  level: INFO # DEBUG, INFO, WARNING, ERROR
  format: json # json, text
  output: both # console, file, both
  file_path: logs/pipeline.log
  rotation: daily
  retention_days: 30
