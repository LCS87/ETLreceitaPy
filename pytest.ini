[pytest]
# Configuração do pytest para o projeto

# Diretórios de teste
testpaths = tests

# Padrões de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --hypothesis-show-statistics

# Markers customizados
markers =
    slow: marca testes que demoram mais de 10 segundos
    integration: marca testes de integração que requerem serviços externos
    benchmark: marca testes de performance/benchmark
    property: marca property-based tests

# Configuração de coverage
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
